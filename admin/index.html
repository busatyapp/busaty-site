<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>لوحة تحكم باصاتي</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: 'Cairo', system-ui;
        background: #0f172a;
        color: #f8fafc;
      }
      .toolbar {
        background: #0b1224;
        padding: 20px 24px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .toolbar h1 {
        margin: 0;
        font-size: 1.1rem;
        color: #f8fafc;
      }
      .toolbar p {
        margin: 0;
        color: rgba(248, 250, 252, 0.7);
        font-size: 0.9rem;
      }
      .toolbar-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-inline-start: auto;
      }
      .toolbar-links a {
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 999px;
        color: #f8fafc;
        background: rgba(14, 165, 183, 0.25);
        font-weight: 600;
        transition: background 0.2s ease;
      }
      .toolbar-links a:hover {
        background: rgba(37, 99, 235, 0.35);
      }
      .toolbar-links a.analytics {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.6), rgba(14, 165, 183, 0.6));
      }
      #nc-root {
        min-height: calc(100vh - 120px);
        background: #fff;
        color: #0f172a;
        padding-bottom: 80px;
      }
      .back-btn {
        display: none;
        padding: 8px 14px;
        border-radius: 999px;
        margin-inline-start: 16px;
        border: 1px solid rgba(248, 250, 252, 0.4);
        background: transparent;
        color: #e2e8f0;
        cursor: pointer;
        font-weight: 600;
      }
      .back-btn.visible {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .back-btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      #busaty-field-outline {
        position: fixed;
        top: 120px;
        inset-inline-end: 16px;
        width: 240px;
        max-height: calc(100vh - 160px);
        background: #0b1224;
        color: #f8fafc;
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        overflow-y: auto;
        display: none;
        z-index: 9;
      }
      #busaty-field-outline.visible {
        display: block;
      }
      #busaty-field-outline h3 {
        margin: 0 0 12px;
        font-size: 0.95rem;
        color: rgba(248, 250, 252, 0.85);
      }
      #busaty-field-outline button {
        width: 100%;
        text-align: start;
        border: 0;
        background: rgba(37, 99, 235, 0.15);
        color: #e0f2fe;
        padding: 8px 12px;
        border-radius: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
      }
      #busaty-field-outline button:hover {
        background: rgba(37, 99, 235, 0.4);
      }
      #busaty-entry-actions {
        position: fixed;
        bottom: 24px;
        inset-inline-start: 24px;
        display: none;
        align-items: center;
        gap: 12px;
        background: rgba(15, 23, 42, 0.85);
        padding: 12px 16px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        z-index: 9;
      }
      #busaty-entry-actions.visible {
        display: inline-flex;
      }
      #busaty-entry-actions button,
      #busaty-entry-actions a {
        border: 0;
        background: rgba(14, 165, 183, 0.3);
        color: #f8fafc;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      #busaty-entry-actions button:hover,
      #busaty-entry-actions a:hover {
        background: rgba(37, 99, 235, 0.4);
      }
      body.busaty-entry-mode #nc-root {
        margin-inline-end: 260px;
      }
      body.busaty-entry-mode {
        background: #020617;
      }
      @media (max-width: 1200px) {
        #busaty-field-outline {
          display: none !important;
        }
        body.busaty-entry-mode #nc-root {
          margin-inline-end: 0;
        }
      }
      /* Hide Decap default collections pane since we have custom toolbar */
      #nc-root aside[class*="Sidebar"],
      #nc-root aside[class*="SidebarContainer"] {
        display: none !important;
      }
      #nc-root [class*="EntryEditor"] {
        margin-inline-start: 0 !important;
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div>
        <h1>لوحة تحكم باصاتي</h1>
        <p>اختر ما تريد تعديله أو راقب التحليلات.</p>
      </div>
      <button id="back-button" class="back-btn" type="button">
        <svg viewBox="0 0 24 24"><path d="M15.5 5.5 9 12l6.5 6.5-1.5 1.5-8-8 8-8z"/></svg>
        رجوع
      </button>
      <nav class="toolbar-links">
        <a href="#/collections/settings">إعدادات عامة</a>
        <a href="#/collections/content_ar">محتوى (العربية)</a>
        <a href="#/collections/content_en">محتوى (English)</a>
        <a href="#/collections/content_fr">محتوى (Français)</a>
        <a class="analytics" href="/admin/analytics.html" target="_blank" rel="noopener">إحصاءات الزيارات</a>
      </nav>
    </header>
    <main id="nc-root">Loading…</main>
    <aside id="busaty-field-outline">
      <h3>محتويات الصفحة</h3>
      <div class="outline-list"></div>
    </aside>
    <div id="busaty-entry-actions">
      <button data-action="top">إلى الأعلى</button>
      <button data-action="back">عودة للقائمة</button>
      <a href="/" target="_blank" rel="noopener">عرض الموقع</a>
    </div>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      const selectors = ['[class*="CollectionPanel"]', '[class*="AppSidebar"]', '[class*="SidebarContainer"]', '[class*="css-102us41"]'];
      const hidePanels = () => {
        selectors.forEach(sel => {
          document.querySelectorAll(sel).forEach(el => {
            if (!el.dataset.hiddenByBusaty) {
              el.style.display = 'none';
              el.setAttribute('aria-hidden', 'true');
              el.dataset.hiddenByBusaty = 'true';
            }
          });
        });
      };

      const observer = new MutationObserver(() => {
        hidePanels();
        scheduleOutlineRefresh();
        const portal = document.querySelector('[class*="Portal-root"]');
        if (portal) {
          portal.remove();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('load', () => {
        hidePanels();
        scheduleOutlineRefresh();
      });

      let currentCollection = null;
      let outlineTimer = null;
      const outline = document.getElementById('busaty-field-outline');
      const outlineList = outline.querySelector('.outline-list');
      const actionBar = document.getElementById('busaty-entry-actions');
      const backButton = document.getElementById('back-button');

      function updateEntryState(inEntry) {
        document.body.classList.toggle('busaty-entry-mode', inEntry);
        outline.classList.toggle('visible', inEntry && window.innerWidth > 1200);
        actionBar.classList.toggle('visible', inEntry);
        if (!inEntry) {
          outlineList.innerHTML = '';
        }
      }

      function updateBackButton() {
        const hash = window.location.hash || '';
        const match = hash.match(/#\/collections\/([^/]+)\/entries/);
        if (match) {
          currentCollection = match[1];
          backButton.classList.add('visible');
          const goBack = () => {
            window.location.hash = `#/collections/${currentCollection}`;
          };
          backButton.onclick = goBack;
          actionBar._goBack = goBack;
          updateEntryState(true);
          scheduleOutlineRefresh();
        } else {
          currentCollection = null;
          backButton.classList.remove('visible');
          updateEntryState(false);
          actionBar._goBack = null;
        }
      }

      function scheduleOutlineRefresh() {
        if (!window.location.hash.includes('/entries/')) {
          return;
        }
        clearTimeout(outlineTimer);
        outlineTimer = setTimeout(buildFieldOutline, 600);
      }

      function buildFieldOutline() {
        if (!window.location.hash.includes('/entries/')) {
          outline.classList.remove('visible');
          return;
        }
        const labels = Array.from(document.querySelectorAll('#nc-root label[for]'));
        if (!labels.length) {
          outlineList.innerHTML = '<p>يتم تحميل الحقول…</p>';
          return;
        }
        outline.classList.add('visible');
        const items = labels.map((label, index) => {
          const text = label.textContent.trim();
          const targetId = label.getAttribute('for');
          if (!text || !targetId) {
            return '';
          }
          return `<button type="button" data-field="${targetId}">${index + 1}. ${text}</button>`;
        }).join('');
        outlineList.innerHTML = items;
      }

      outlineList.addEventListener('click', event => {
        const trigger = event.target.closest('button[data-field]');
        if (!trigger) return;
        const target = document.getElementById(trigger.dataset.field);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.focus({ preventScroll: true });
          target.dispatchEvent(new Event('focus', { bubbles: true }));
          target.dispatchEvent(new Event('click', { bubbles: true }));
        }
      });

      actionBar.addEventListener('click', event => {
        const actionTarget = event.target.closest('[data-action]');
        if (!actionTarget) {
          return;
        }
        const action = actionTarget.dataset.action;
        if (action === 'top') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (action === 'back' && typeof actionBar._goBack === 'function') {
          actionBar._goBack();
        }
      });

      window.addEventListener('hashchange', updateBackButton);
      updateBackButton();
    </script>
  </body>
</html>
