<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>لوحة تحكم باصاتي</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: 'Cairo', system-ui;
        background: #0f172a;
        color: #f8fafc;
      }
      .toolbar {
        background: #0b1224;
        padding: 20px 24px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .toolbar h1 {
        margin: 0;
        font-size: 1.1rem;
        color: #f8fafc;
      }
      .toolbar p {
        margin: 0;
        color: rgba(248, 250, 252, 0.7);
        font-size: 0.9rem;
      }
      .toolbar-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-inline-start: auto;
      }
      .toolbar-links a {
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 999px;
        color: #f8fafc;
        background: rgba(14, 165, 183, 0.25);
        font-weight: 600;
        transition: background 0.2s ease;
      }
      .toolbar-links a:hover {
        background: rgba(37, 99, 235, 0.35);
      }
      .toolbar-links a.analytics {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.6), rgba(14, 165, 183, 0.6));
      }
      #nc-root {
        min-height: calc(100vh - 120px);
        background: #fff;
        color: #0f172a;
        padding-bottom: 40px;
      }
      .back-btn {
        display: none;
        padding: 8px 14px;
        border-radius: 999px;
        margin-inline-start: 16px;
        border: 1px solid rgba(248, 250, 252, 0.4);
        background: transparent;
        color: #e2e8f0;
        cursor: pointer;
        font-weight: 600;
      }
      .back-btn.visible {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .back-btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      /* Hide Decap default collections pane since we have custom toolbar */
      [class*="AppSidebar-root"],
      [class*="CollectionPanel-root"] {
        display: none !important;
      }
      [class*="AppMain-root"],
      [class*="AppContent-root"] {
        margin-inline-start: 0 !important;
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div>
        <h1>لوحة تحكم باصاتي</h1>
        <p>اختر ما تريد تعديله أو راقب التحليلات.</p>
      </div>
      <button id="back-button" class="back-btn" type="button">
        <svg viewBox="0 0 24 24"><path d="M15.5 5.5 9 12l6.5 6.5-1.5 1.5-8-8 8-8z"/></svg>
        رجوع
      </button>
      <nav class="toolbar-links">
        <a href="#/collections/settings">إعدادات عامة</a>
        <a href="#/collections/content_ar">محتوى (العربية)</a>
        <a href="#/collections/content_en">محتوى (English)</a>
        <a href="#/collections/content_fr">محتوى (Français)</a>
        <a class="analytics" href="/admin/analytics.html" target="_blank" rel="noopener">إحصاءات الزيارات</a>
      </nav>
    </header>
    <main id="nc-root">Loading…</main>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      const selectors = ['[class*="CollectionPanel"]', '[class*="AppSidebar"]', '[class*="css-102us41"]'];
      const hidePanels = () => {
        selectors.forEach(sel => {
          document.querySelectorAll(sel).forEach(el => {
            if (!el.dataset.hiddenByBusaty) {
              el.style.display = 'none';
              el.setAttribute('aria-hidden', 'true');
              el.dataset.hiddenByBusaty = 'true';
            }
          });
        });
      };

      const observer = new MutationObserver(() => {
        hidePanels();
        const portal = document.querySelector('[class*="Portal-root"]');
        if (portal) {
          portal.remove();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('load', hidePanels);

      function updateBackButton() {
        const hash = window.location.hash || '';
        const button = document.getElementById('back-button');
        const match = hash.match(/#\/collections\/([^/]+)\/entries/);
        if (match) {
          button.classList.add('visible');
          button.onclick = () => {
            window.location.hash = `#/collections/${match[1]}`;
          };
        } else {
          button.classList.remove('visible');
        }
      }

      window.addEventListener('hashchange', updateBackButton);
      updateBackButton();
    </script>
  </body>
</html>
